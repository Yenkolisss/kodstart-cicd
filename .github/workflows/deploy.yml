# Workflow автоматической проверки и публикации статического сайта на GitHub Pages.
# Файл размещается в репозитории по пути: .github/workflows/deploy.yml

name: Deploy static site   # название workflow (видно на вкладке Actions)

on:
  push:
    branches: [ main ]     # проверка и деплой при каждом push в main
  pull_request:
    branches: [ main ]     # только проверка для запросов на слияние в main
  workflow_dispatch:       # ручной запуск кнопкой Run workflow

# Права доступа, необходимые для публикации на GitHub Pages
permissions:
  contents: read    # чтение файлов репозитория
  pages: write      # разрешение на публикацию в Pages
  id-token: write   # OIDC-токен для подтверждения деплоя

jobs:
  # Задание 1. Автопроверка качества кода (линтинг) перед публикацией
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install linters
        run: npm install --no-save htmlhint@1.1.4 stylelint@16.10.0 stylelint-config-recommended@14.0.1

      # Проверка HTML по правилам из файла .htmlhintrc
      - name: Lint HTML (HTMLHint)
        run: npx htmlhint "**/*.html"

      # Проверка CSS по правилам из файла .stylelintrc.json
      - name: Lint CSS (Stylelint)
        run: npx stylelint "**/*.css"

  # Задание 2. Публикация сайта — только если проверка прошла и это не pull request
  deploy:
    needs: lint
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest # виртуальная машина-исполнитель
    environment:
      name: github-pages
      # ссылка на опубликованный сайт появится в сводке запуска
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Шаг 1. Скопировать файлы репозитория на виртуальную машину
      - name: Checkout repository
        uses: actions/checkout@v4

      # Шаг 2. Подготовить окружение GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Шаг 3. Упаковать файлы сайта в артефакт (path: '.' = весь проект)
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      # Шаг 4. Опубликовать артефакт на GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
